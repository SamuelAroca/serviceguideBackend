spring.config.import= optional:secrets.properties

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

# Safe default when no profile is active; the "dev" profile (see
# application-dev.properties) overrides this for local debugging.
spring.jpa.show-sql=false

# NOTE: several DTOs/entities (e.g. House.receipts) are serialized straight
# from lazily-fetched associations without explicit fetch joins. Turning
# this off breaks those responses with LazyInitializationException once
# the transaction closes. Would need a fetch-join/DTO-projection audit
# across every serialized entity before it's safe to disable.
spring.jpa.open-in-view=true

server.port=5001

spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
